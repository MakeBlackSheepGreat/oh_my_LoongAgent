<text x="56" y="68" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="34" font-weight="bold" fill="#0B1F3A">关键技术把“小模型”变成“可用节点”</text>
<rect x="56" y="92" width="1168" height="48" rx="12" fill="#EAF2F8"/>
<text x="80" y="123" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#1F2937">技术路线的共同目标：降低部署门槛，同时把任务边界和升级路径设计清楚。</text>
<rect x="70" y="240" width="190" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><use data-icon="phosphor-duotone/brain" x="141.0" y="265" width="48" height="48" fill="#1565C0"/><text x="165.0" y="342" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B1F3A">知识蒸馏</text><text x="165.0" y="375" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#0B1F3A">角色策略迁移</text><polygon points="282,320 312,334 282,348" fill="#1565C0"/><rect x="330" y="240" width="190" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><use data-icon="phosphor-duotone/cpu" x="401.0" y="265" width="48" height="48" fill="#1565C0"/><text x="425.0" y="342" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B1F3A">量化压缩</text><text x="425.0" y="375" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#0B1F3A">降低显存带宽</text><polygon points="542,320 572,334 542,348" fill="#1565C0"/><rect x="590" y="240" width="190" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><use data-icon="phosphor-duotone/gear-six" x="661.0" y="265" width="48" height="48" fill="#1565C0"/><text x="685.0" y="342" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B1F3A">LoRA 适配</text><text x="685.0" y="375" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#0B1F3A">训练垂直角色</text><polygon points="802,320 832,334 802,348" fill="#1565C0"/><rect x="850" y="240" width="190" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><use data-icon="phosphor-duotone/flow-arrow" x="921.0" y="265" width="48" height="48" fill="#1565C0"/><text x="945.0" y="342" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B1F3A">模型路由</text><text x="945.0" y="375" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#0B1F3A">大小模型分层</text><polygon points="1062,320 1092,334 1062,348" fill="#1565C0"/><rect x="1110" y="240" width="120" height="178" rx="18" fill="#0B1F3A"/><use data-icon="phosphor-duotone/database" x="1146.0" y="265" width="48" height="48" fill="#22C1C3"/><text x="1170.0" y="342" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">RAG</text><text x="1170.0" y="375" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">流程编排</text>
<rect x="180" y="500" width="920" height="66" rx="18" fill="#EAF2F8"/>
<text x="640" y="540" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1565C0">关键不是“模型变小”，而是让模型节点可训练、可部署、可路由、可治理。</text>
<text x="56" y="682" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#94A3B8"></text>
