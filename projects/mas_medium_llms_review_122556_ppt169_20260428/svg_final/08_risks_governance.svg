<text x="56" y="68" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="34" font-weight="bold" fill="#0B1F3A">多智能体不天然更可靠：错误可能被放大</text>

<path fill="#D97706" fill-opacity="0.12" stroke="#D97706" d="M72,96 H1208 A16,16 0 0 1 1224,112 V150 A16,16 0 0 1 1208,166 H72 A16,16 0 0 1 56,150 V112 A16,16 0 0 1 72,96 Z" />
