<text x="640" y="270" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="25" fill="#FFFFFF">成熟的多智能体系统，不会简单追求模型越大越好</text>
<path fill="#FFFFFF" fill-opacity="0.10" stroke="#22C1C3" d="M208,336 H1072 A18,18 0 0 1 1090,354 V376 A18,18 0 0 1 1072,394 H208 A18,18 0 0 1 190,376 V354 A18,18 0 0 1 208,336 Z" /><text x="640" y="373" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1. 中小型大模型是基础执行层，不是超大模型替代品</text>
<path fill="#FFFFFF" fill-opacity="0.10" stroke="#22C1C3" d="M208,420 H1072 A18,18 0 0 1 1090,438 V460 A18,18 0 0 1 1072,478 H208 A18,18 0 0 1 190,460 V438 A18,18 0 0 1 208,420 Z" /><text x="640" y="457" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2. 最适合高频、明确、可编排、可治理的智能体节点</text>
<path fill="#FFFFFF" fill-opacity="0.10" stroke="#22C1C3" d="M208,504 H1072 A18,18 0 0 1 1090,522 V544 A18,18 0 0 1 1072,562 H208 A18,18 0 0 1 190,544 V522 A18,18 0 0 1 208,504 Z" /><text x="640" y="541" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3. 未来价值取决于模型、工具、知识、流程和安全协同</text>
